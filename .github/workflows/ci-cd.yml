name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/rag-engine

jobs:
  # ── 1. LINT ───────────────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff Check
      run: ruff check . --exclude .git,__pycache__,build,dist

    - name: Run Ruff Format Check
      run: ruff format --check . --exclude .git,__pycache__,build,dist
      continue-on-error: true

  # ── 2. TEST ───────────────────────────────────────────────────
  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: pytest tests/ -v

  # ── 3. SECURITY ───────────────────────────────────────────────
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install security tools
      run: pip install bandit pip-audit

    - name: Run Bandit (SAST)
      run: bandit -r . --exclude ./tests,./.git -f txt || true

    - name: Run pip-audit
      run: |
        # Runs audit on dependencies. If vulnerabilities are found, it lists them.
        pip-audit --desc || true

  # ── 4. BUILD DOCKER ───────────────────────────────────────────
  build-docker:
    name: Build & Check Docker
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ── 5. NOTIFY ─────────────────────────────────────────────────
  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build-docker]
    if: always()

    steps:
    - name: Publish Summary
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint & Code Quality | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Pytest Suite | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scans | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build & Check Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
